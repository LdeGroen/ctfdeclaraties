# Dependabot (INF-06). Minder ruis, en security gescheiden van de rest:
# - Security-updates staan aan (Settings → Code security) en komen meteen, gebundeld:
#   één PR voor wat in de bundel meegaat en één voor build-tooling (react-scripts-keten).
# - Gewone updates maandelijks, per ecosysteem gebundeld: runtime-minor/patch in één PR,
#   build-tooling-minor/patch (react-scripts, tailwind, postcss) in één PR, en alle majors
#   samen in een aparte PR. Die laatste vraagt aandacht: lezen, bouwen, app openen.
# - Geen majors van react-scripts: CRA wordt niet meer onderhouden; een overstap is een
#   migratie (Vite), geen update (FRM-18).
# Mergen = gewone PR-flow; de deploy volgt vanzelf na een groene build.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: react-scripts
        update-types: ["version-update:semver-major"]
    groups:
      runtime:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      build-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]
      security-runtime:
        applies-to: security-updates
        dependency-type: production
        patterns: ["*"]
      security-build-tooling:
        applies-to: security-updates
        dependency-type: development
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Alle actions in één PR, ook majors: de eerstvolgende build laat zien of het werkt.
      actions:
        patterns: ["*"]
